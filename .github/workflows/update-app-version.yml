name: Detect Android APK version

on:
  push:
    branches:
      - main
    paths:
      - "app-release.apk"
      - ".github/workflows/update-app-version.yml"
      - "scripts/update_app_changelog.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-android-app-version
  cancel-in-progress: false

jobs:
  read-apk-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website repository
        uses: actions/checkout@v4

      - name: Check whether app-release.apk is available
        id: apk
        shell: bash
        run: |
          if [[ -f app-release.apk ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "app-release.apk found; updating app metadata."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::app-release.apk is missing; skipping Android app metadata update."
          fi

      - name: Find Android APK metadata tool
        if: steps.apk.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [[ ! -d "$SDK_ROOT/build-tools" ]]; then
            mkdir -p "$SDK_ROOT/build-tools"
          fi
          AAPT="$(find "$SDK_ROOT/build-tools" -mindepth 2 -maxdepth 2 -type f -name aapt | sort -V | tail -n 1)"
          if [[ -z "$AAPT" ]]; then
            sdkmanager "build-tools;35.0.0"
            AAPT="$SDK_ROOT/build-tools/35.0.0/aapt"
          fi
          test -x "$AAPT" || { echo "Android aapt is unavailable"; exit 1; }
          echo "AAPT_PATH=$AAPT" >> "$GITHUB_ENV"

      - name: Read version from APK and update app-version.json
        if: steps.apk.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$AAPT_PATH"
          BADGING="$("$AAPT" dump badging app-release.apk)"
          PACKAGE_LINE="$(printf '%s\n' "$BADGING" | sed -n '1p')"
          VERSION_CODE="$(printf '%s\n' "$PACKAGE_LINE" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")"
          VERSION_NAME="$(printf '%s\n' "$PACKAGE_LINE" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")"

          if [[ -z "$VERSION_CODE" || -z "$VERSION_NAME" ]]; then
            echo "Nepodarilo sa prečítať versionCode/versionName z app-release.apk."
            echo "$PACKAGE_LINE"
            exit 1
          fi

          python3 - "$VERSION_CODE" "$VERSION_NAME" <<'PY'
          import json, pathlib, sys
          code, name = int(sys.argv[1]), sys.argv[2]
          path = pathlib.Path("app-version.json")
          data = json.loads(path.read_text(encoding="utf-8")) if path.exists() else {}
          data["versionCode"] = code
          data["versionName"] = name
          data["downloadUrl"] = "https://ptgamingsk.github.io/app-release.apk"
          data["message"] = f"Je dostupná nová verzia PTGamingSK Official V{name}!"
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(f"APK verzia rozpoznaná: {name} (code {code})")
          PY
          echo "APK_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "APK_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

      - name: Record release notes from APK upload
        if: steps.apk.outputs.available == 'true'
        run: python3 scripts/update_app_changelog.py "$APK_VERSION_CODE" "$APK_VERSION_NAME"

      - name: Commit version metadata and release notes (retry if busy)
        if: steps.apk.outputs.available == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          apk_blob="$(git rev-parse HEAD:app-release.apk)"
          work_files="$(mktemp -d)"
          trap 'rm -rf "$work_files"' EXIT
          cp app-version.json "$work_files/app-version.json"
          cp app-changelog.json "$work_files/app-changelog.json"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            current_blob="$(git rev-parse origin/main:app-release.apk)"
            if [[ "$current_blob" != "$apk_blob" ]]; then
              echo "Another APK was uploaded; the newer workflow run will update metadata."
              exit 0
            fi
            git reset --hard origin/main
            cp "$work_files/app-version.json" app-version.json
            cp "$work_files/app-changelog.json" app-changelog.json
            git add app-version.json app-changelog.json
            if git diff --cached --quiet; then
              echo "Version and release notes are already up to date."
              exit 0
            fi
            git commit -m "Automatically detect Android APK version and release notes"
            if git push origin HEAD:main; then
              echo "Version and release notes published successfully."
              exit 0
            fi
            echo "Another workflow updated main; retrying ($attempt/5)"
            sleep 2
          done
          echo "Could not publish version and release notes after 5 retries."
          exit 1
