name: Update Kick follower statistics
on:
  schedule:
    - cron: '9,39 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kick-stats-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch public Kick follower count
        run: python3 scripts/update_kick_stats.py
      - name: Commit updated statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/kick-stats.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh Kick follower statistics"
            git push
          fi
