name: Update Facebook follower stats
on:
  schedule:
    - cron: '11,41 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-facebook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch Facebook followers from Meta Graph API
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
        run: python scripts/update_facebook_stats.py
      - name: Commit updated public stats
        run: |
          if ! git diff --quiet -- assets/facebook-stats.json || [ -n "$(git ls-files --others --exclude-standard assets/facebook-stats.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/facebook-stats.json
            git commit -m "Update Facebook follower statistics"
            git push
          fi
